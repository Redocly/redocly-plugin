name: Context sync

on:
  schedule:
    # Every day at 05:00 UTC.
    # GitHub sends the failure notice only to the person who last changed this line.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: context-sync
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTEXT_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTEXT_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
      - id: sync
        env:
          SYNC_BODY_FILE: ${{ runner.temp }}/context-sync-body.md
        run: .github/scripts/context-sync.sh
      - name: Open, update or close the sync pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SYNC_BRANCH: chore/context-sync
          CHANGED: ${{ steps.sync.outputs.changed }}
          TITLE: ${{ steps.sync.outputs.title }}
          BODY_FILE: ${{ runner.temp }}/context-sync-body.md
        run: .github/scripts/context-sync-pr.sh
